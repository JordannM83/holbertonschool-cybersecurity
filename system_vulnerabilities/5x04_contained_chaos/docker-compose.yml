services:
  dev:
    image: secure-python-dev:v1
    build:
      context: .
      dockerfile: 15-Dockerfile.securedev
    working_dir: /app
    user: "1000:1000"
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: false
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/logs:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000
      - /home/devuser:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=default
    pids_limit: 50
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    init: true
    stdin_open: true
    tty: true
    command: ["python"]
