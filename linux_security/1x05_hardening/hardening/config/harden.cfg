# Output files used for persistent logs and the final audit summary.
LOG_FILE="/var/log/hardening.log"
AUDIT_REPORT="$PWD/audit_report.txt"

# System configuration files modified by the hardening framework.
FIREWALL="/etc/hardening/firewall.rules"
SYSCTL_FILE="/etc/sysctl.conf"
SSHD_CONFIG="/etc/ssh/sshd_config"
LOGIN_CONFIG="/etc/login.defs"
PWQ_CONF="/etc/security/pwquality.conf"
FAILLOCK_CONF="/etc/security/faillock.conf"
PASSWD_FILE="/etc/passwd"
PAM_COMMON_PASSWORD="/etc/pam.d/common-password"
PAM_COMMON_AUTH="/etc/pam.d/common-auth"
PAM_COMMON_ACCOUNT="/etc/pam.d/common-account"

# Network access policy. HTTP and HTTPS rules are optional switches.
SSH_PORT="22"
SSH_PORT_KEY="Port"
ALLOW_HTTP="True"
ALLOW_HTTPS="True"
HTTP_PORT="80"
HTTPS_PORT="443"

# Firewall defaults and persistent IPv4 kernel hardening values.
DEFAULT_INPUT="deny"
DEFAULT_OUTPUT="allow"
IP_FORWARD_KEY="net.ipv4.ip_forward"
IP_FORWARD_VALUE="0"
IGNORE_PING_KEY="net.ipv4.icmp_echo_ignore_all"
IGNORE_PING_VALUE="1"

# Required OpenSSH server directives and their secure values.
PASSWORD_AUTHENTICATION_KEY="PasswordAuthentication"
PASSWORD_AUTHENTICATION_VALUE="no"
PUB_KEY_AUTHENTICATION_KEY="PubkeyAuthentication"
PUB_KEY_AUTHENTICATION_VALUE="yes"
PERMIT_ROOT_LOGIN_KEY="PermitRootLogin"
PERMIT_ROOT_LOGIN_VALUE="no"

# Password lifetime, strength, and failed-login thresholds.
PASS_MIN_LEN="12"
PASS_MAX_DAYS="90"
FAIL_LOCK_ATTEMPTS="5"

# pwquality and faillock directive names used in security configuration files.
PWQUALITY_MINLEN_KEY="minlen"
PWQUALITY_UPPER_KEY="ucredit"
PWQUALITY_LOWER_KEY="lcredit"
PWQUALITY_DIGIT_KEY="dcredit"
PWQUALITY_SPECIAL_KEY="ocredit"
PWQUALITY_REQUIRED_VALUE="-1"
FAILLOCK_DENY_KEY="deny"

# Local account cleanup policy and accounts/groups that retain access.
MIN_USER_UID="1000"
PRIVILEGED_GROUPS=("sudo" "wheel")
ROOT_ACCOUNT="root"

# Exact PAM modules and rules required to enforce password and lockout policy.
PAM_PWQUALITY_MODULE="pam_pwquality.so"
PAM_PWQUALITY_RULE="password requisite pam_pwquality.so retry=3"
PAM_FAILLOCK_MODULE="pam_faillock.so"
PAM_FAILLOCK_PREAUTH_RULE="auth required pam_faillock.so preauth silent"
PAM_FAILLOCK_AUTHFAIL_RULE="auth [default=die] pam_faillock.so authfail"
PAM_FAILLOCK_ACCOUNT_RULE="account required pam_faillock.so"

# Package groups removed or installed by the system hardening domain.
BLOATWARE_PACKAGES=("telnet" "ftp" "netcat-traditional")
SECURITY_PACKAGES=("auditd" "fail2ban")
IDENTITY_PACKAGES=("libpam-pwquality")
